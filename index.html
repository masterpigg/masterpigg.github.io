<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>masterpigg · Projects</title>
<meta name="description" content="Games, tools, maps and 3D prints by masterpigg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f9;
    --card: #ffffff;
    --text: #0f1b33;
    --muted: #4a5873;
    --border: #d5ddeb;
    --accent: #1d4ed8;
    --accent-text: #ffffff;
    --accent-soft: #e3ebfb;
    --tag-bg: #e7edf7;
    --shadow: 0 1px 2px rgba(15,27,51,.05), 0 4px 16px rgba(15,27,51,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #08111f;
      --card: #0f1d35;
      --text: #e6ecf7;
      --muted: #9aabc8;
      --border: #1e3256;
      --accent: #6ea8ff;
      --accent-text: #08111f;
      --accent-soft: #13284a;
      --tag-bg: #172b4d;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #08111f; --card: #0f1d35; --text: #e6ecf7; --muted: #9aabc8;
    --border: #1e3256; --accent: #6ea8ff; --accent-text: #08111f; --accent-soft: #13284a; --tag-bg: #172b4d; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 16px 40px; }

  header { margin-bottom: 36px; }
  h1 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .intro { color: var(--muted); max-width: 60ch; margin: 0 0 20px; }
  .profiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .profiles a {
    color: var(--text); text-decoration: none; font-weight: 500; font-size: .9rem;
    border: 1px solid var(--border); background: var(--card);
    padding: 6px 12px; border-radius: 999px;
  }
  .profiles a:hover { border-color: var(--accent); color: var(--accent); }

  .jump { display: flex; flex-wrap: wrap; gap: 8px; }
  .jump a {
    color: var(--text); text-decoration: none; font-weight: 500; font-size: .9rem;
    border: 1px solid var(--border); background: var(--card);
    padding: 6px 12px; border-radius: 999px;
  }
  .jump a:hover { border-color: var(--accent); color: var(--accent); }

  .hobby { margin-top: 48px; scroll-margin-top: 16px; }
  .hobby-head { border-top: 1px solid var(--border); padding-top: 24px; margin-bottom: 18px; }
  .hobby-head h2 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .hobby-head p { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    aspect-ratio: 16 / 9; background: var(--accent-soft);
    display: grid; place-items: center; font-size: 3rem;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h3 { font-size: 1.1rem; margin: 0; }
  .status {
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent); margin-left: 6px; vertical-align: 2px;
  }
  .desc { color: var(--muted); margin: 0; font-size: .95rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--tag-bg); color: var(--muted); font-size: .75rem; padding: 2px 8px; border-radius: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .88rem;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); color: var(--text);
  }
  .links a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .links a:hover { filter: brightness(1.08); }

  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Things I've made</h1>
    <p class="intro">Software, games and 3D prints. Some are open source and some aren't, but you can try or download all of them from the links below.</p>
    <nav class="jump" id="jump" aria-label="Sections"></nav>
  </header>

  <div id="sections"></div>

  <footer>© <span id="year"></span> masterpigg</footer>
</main>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT HERE: one block per hobby, each with its own projects.
   - profiles: buttons under the section heading (MakerWorld, GitHub, itch.io…)
   - To add a project, copy one { ... } block inside "projects".
   - image: optional path or URL to a screenshot (e.g. "img/wheel.jpg");
            if left out, the emoji is shown instead.
   - links: the first link is the highlighted button. A project's links
            can point anywhere: MakerWorld, itch.io, GitHub, etc.
   - status: optional small label, e.g. "Coming soon" or "Beta".
   To add a new hobby, copy a whole section block.
   ───────────────────────────────────────────────────────────── */
const SECTIONS = [
  {
    id: "software",
    title: "Software",
    intro: "Web apps, tools and games.",
    profiles: [
      { label: "GitHub", url: "https://github.com/masterpigg" },
      // { label: "itch.io", url: "https://masterpigg.itch.io" },
    ],
    projects: [
      {
        title: "Realm Cartographer",
        emoji: "🗺️",
        description: "Turns real-world satellite imagery, GIS and historical map data into hand-drawn D&D battlemaps and regional maps you can export to virtual tabletops.",
        tags: ["D&D", "Maps", "Web app"],
        links: [
          { label: "Open app", url: "https://realm-cartographer.duckdns.org" },
        ],
      },
      {
        title: "DIY Gaming Tools",
        emoji: "🎮",
        description: "A game-making suite for parents and kids to use together. Draw characters on paper, scan them in, and build a real, playable 2D game with kid-friendly editors.",
        tags: ["Game dev", "Kids", "Desktop app"],
        status: "In progress",
        links: [],
      },
      {
        title: "Stardew Valley Character Creator",
        emoji: "🌱",
        description: "A tool for designing your own Stardew Valley characters.",
        tags: ["Stardew Valley"],
        status: "Coming soon",
        links: [],
      },
    ],
  },
  {
    id: "3d-printing",
    title: "3D printing",
    intro: "Printable toys and gadgets. Models are free to download.",
    profiles: [
      { label: "MakerWorld profile", url: "https://makerworld.com/en/@masterpigg" },
    ],
    projects: [
      {
        title: "Large Customizable Prize Wheel",
        emoji: "🎡",
        description: "A big spinning prize wheel you can 3D print and customize. The collection includes accessories.",
        tags: ["3D print", "Customizable"],
        links: [
          { label: "View model", url: "https://makerworld.com/en/models/3274478-large-customizable-prize-wheel#profileId-3713399" },
          { label: "Collection + accessories", url: "https://makerworld.com/en/collections/34862354-large-customizable-prize-wheel" },
        ],
      },
      {
        title: "Dummy 13 Head Creator",
        emoji: "🤖",
        description: "Custom heads for the Dummy 13 printable figure, plus a tool to design your own.",
        tags: ["3D print", "Dummy 13"],
        status: "Coming soon",
        links: [],
      },
    ],
  },
  {
    id: "fll",
    title: "FIRST LEGO League",
    intro: "Tools and projects made for our FLL team.",
    profiles: [],
    projects: [
      {
        title: "BioGlow Robot Simulator",
        emoji: "🤖",
        description: "A browser simulator for the FIRST LEGO League 2026–27 BioGlow Robot Game. Build or import SPIKE Prime Word Blocks programs and watch a virtual robot run them on the mat.",
        tags: ["Robot Game", "SPIKE Prime", "Web app"],
        links: [
          { label: "Try it", url: "https://masterpigg.github.io/fll-bioglow-simulator/" },
          { label: "Source", url: "https://github.com/masterpigg/fll-bioglow-simulator" },
        ],
      },
      {
        title: "Don't Cross the Streams",
        emoji: "🦌",
        description: "An interactive map of wildlife sightings, roadkill hotspots and existing crossings in the St. Louis region, built from live public data to show where roads and rivers cut off wildlife.",
        tags: ["Innovation Project", "Wildlife", "Maps"],
        links: [
          { label: "Open app", url: "https://masterpigg.github.io/dont-cross-the-streams/" },
          { label: "Source", url: "https://github.com/masterpigg/dont-cross-the-streams" },
        ],
      },
      {
        title: "Commit Crew",
        emoji: "📲",
        description: "An Android tablet app that teaches an FLL team Kanban and version control by doing them for real. Kids move sticky notes on a task board, save SPIKE Prime code as checkpoints and snap meeting notes, all into the team's GitHub repo without learning Git.",
        tags: ["Android", "Team tools"],
        links: [
          { label: "Source", url: "https://github.com/masterpigg/commit-crew" },
        ],
      },
    ],
  },
];
/* ───────────────────────── end of editable section ───────────────────────── */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pill = l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;

function card(p) {
  const thumb = p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.title)} screenshot" loading="lazy">`
    : `<span aria-hidden="true">${p.emoji || "✨"}</span>`;
  const links = (p.links || []).filter(l => l.url).map((l, i) =>
    `<a class="${i === 0 ? "primary" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  return `<article class="card">
    <div class="thumb">${thumb}</div>
    <div class="body">
      <h3>${esc(p.title)}${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}</h3>
      <p class="desc">${esc(p.description)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </div>
  </article>`;
}

document.getElementById("jump").innerHTML = SECTIONS
  .map(s => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join("");

document.getElementById("sections").innerHTML = SECTIONS.map(s => `
  <section class="hobby" id="${esc(s.id)}">
    <div class="hobby-head">
      <h2>${esc(s.title)}</h2>
      ${s.intro ? `<p>${esc(s.intro)}</p>` : ""}
      <nav class="profiles">${(s.profiles || []).filter(l => l.url).map(pill).join("")}</nav>
    </div>
    <div class="grid">${s.projects.map(card).join("")}</div>
  </section>`).join("");

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
