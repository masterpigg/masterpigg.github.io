<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>masterpigg · Projects</title>
<meta name="description" content="Games, tools, maps and 3D prints by masterpigg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #5f6368;
    --border: #e3e1da;
    --accent: #d9480f;
    --accent-soft: #fff1e8;
    --tag-bg: #f0eee8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --card: #1e1e22;
      --text: #ececee;
      --muted: #a0a0a8;
      --border: #2e2e34;
      --accent: #ff8a4c;
      --accent-soft: #2e1d14;
      --tag-bg: #2a2a30;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --card: #1e1e22; --text: #ececee; --muted: #a0a0a8;
    --border: #2e2e34; --accent: #ff8a4c; --accent-soft: #2e1d14; --tag-bg: #2a2a30; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 16px 40px; }

  header { margin-bottom: 36px; }
  h1 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .intro { color: var(--muted); max-width: 60ch; margin: 0 0 20px; }
  .profiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .profiles a {
    color: var(--text); text-decoration: none; font-weight: 500; font-size: .9rem;
    border: 1px solid var(--border); background: var(--card);
    padding: 6px 12px; border-radius: 999px;
  }
  .profiles a:hover { border-color: var(--accent); color: var(--accent); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .filters button {
    font: inherit; font-size: .85rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
  }
  .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    aspect-ratio: 16 / 9; background: var(--accent-soft);
    display: grid; place-items: center; font-size: 3rem;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h2 { font-size: 1.1rem; margin: 0; }
  .status {
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent); margin-left: 6px; vertical-align: 2px;
  }
  .desc { color: var(--muted); margin: 0; font-size: .95rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--tag-bg); color: var(--muted); font-size: .75rem; padding: 2px 8px; border-radius: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .88rem;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); color: var(--text);
  }
  .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .links a:hover { filter: brightness(1.08); }

  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Things I've made</h1>
    <p class="intro">Games, tools, maps and 3D prints. Some are open source and some aren't, but you can try or download all of them from the links below.</p>
    <nav class="profiles" id="profiles"></nav>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
  <section class="grid" id="grid"></section>

  <footer>© <span id="year"></span> masterpigg</footer>
</main>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT HERE: your profiles and projects.
   To add a project, copy one { ... } block and change it.
   - image: optional path or URL to a screenshot (e.g. "img/wheel.jpg");
            if left out, the emoji is shown instead.
   - links: first link is the highlighted button. Leave out any you
            don't have (e.g. no "Source" for private repos).
   - status: optional small label, e.g. "Coming soon" or "Beta".
   ───────────────────────────────────────────────────────────── */
const PROFILES = [
  { label: "GitHub",    url: "https://github.com/masterpigg" },
  { label: "MakerWorld", url: "https://makerworld.com/en/@masterpigg" },
  // { label: "itch.io", url: "https://masterpigg.itch.io" },
];

const PROJECTS = [
  {
    title: "Realm Cartographer",
    emoji: "🗺️",
    category: "Web app",
    description: "Turns real-world satellite imagery, GIS and historical map data into hand-drawn D&D battlemaps and regional maps you can export to virtual tabletops.",
    tags: ["D&D", "Maps", "Python", "Leaflet"],
    links: [
      { label: "Open app", url: "https://realm-cartographer.onrender.com" },
    ],
  },
  {
    title: "BioGlow Robot Simulator",
    emoji: "🤖",
    category: "Web app",
    description: "A browser simulator for the FIRST LEGO League 2026–27 BioGlow Robot Game. Build or import SPIKE Prime Word Blocks programs and watch a virtual robot run them on the mat.",
    tags: ["FLL", "Robotics", "Education"],
    links: [
      { label: "Try it", url: "https://masterpigg.github.io/fll-bioglow-simulator/" },
      { label: "Source", url: "https://github.com/masterpigg/fll-bioglow-simulator" },
    ],
  },
  {
    title: "Printable Prize Wheel",
    emoji: "🎡",
    category: "3D print",
    description: "A spinning prize wheel you can 3D print. Download the model files from MakerWorld.",
    tags: ["3D printing"],
    links: [
      { label: "View on MakerWorld", url: "https://makerworld.com/en/@masterpigg" },
    ],
  },
  {
    title: "DIY Gaming Tools",
    emoji: "🎮",
    category: "Desktop app",
    description: "A game-making suite for parents and kids to use together. Draw characters on paper, scan them in, and build a real, playable 2D game with kid-friendly editors.",
    tags: ["Game dev", "Kids", "Electron"],
    status: "In progress",
    links: [
      // { label: "Download", url: "" },
    ],
  },
  {
    title: "itch.io games",
    emoji: "🕹️",
    category: "Game",
    description: "A couple of small games, coming soon to itch.io.",
    tags: ["Games"],
    status: "Coming soon",
    links: [],
  },
];
/* ───────────────────────── end of editable section ───────────────────────── */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

document.getElementById("profiles").innerHTML = PROFILES
  .map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.label)}</a>`).join("");

function card(p) {
  const thumb = p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.title)} screenshot" loading="lazy">`
    : `<span aria-hidden="true">${p.emoji || "✨"}</span>`;
  const links = (p.links || []).filter(l => l.url).map((l, i) =>
    `<a class="${i === 0 ? "primary" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  return `<article class="card">
    <div class="thumb">${thumb}</div>
    <div class="body">
      <h2>${esc(p.title)}${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}</h2>
      <p class="desc">${esc(p.description)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </div>
  </article>`;
}

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const categories = ["All", ...new Set(PROJECTS.map(p => p.category).filter(Boolean))];

function render(cat) {
  grid.innerHTML = PROJECTS.filter(p => cat === "All" || p.category === cat).map(card).join("");
  filters.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === cat));
}
filters.innerHTML = categories.map(c => `<button type="button" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
filters.addEventListener("click", e => { if (e.target.dataset.cat) render(e.target.dataset.cat); });
render("All");

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
