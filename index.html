<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>masterpigg · Projects</title>
<meta name="description" content="Games, tools, maps and 3D prints by masterpigg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f9;
    --card: #ffffff;
    --text: #0f1b33;
    --muted: #4a5873;
    --border: #d5ddeb;
    --accent: #1d4ed8;
    --accent-2: #7c3aed;
    --accent-3: #0891b2;
    --accent-text: #ffffff;
    --accent-soft: #e3ebfb;
    --tag-bg: #e7edf7;
    --shadow: 0 1px 2px rgba(15,27,51,.05), 0 4px 16px rgba(15,27,51,.07);
    --glass: rgba(255,255,255,.78);
    --blob-opacity: .35;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #08111f;
      --card: #0f1d35;
      --text: #e6ecf7;
      --muted: #9aabc8;
      --border: #1e3256;
      --accent: #6ea8ff;
      --accent-2: #a78bfa;
      --accent-3: #22d3ee;
      --accent-text: #08111f;
      --accent-soft: #13284a;
      --tag-bg: #172b4d;
      --shadow: none;
      --glass: rgba(15,29,53,.72);
      --blob-opacity: .45;
    }
  }
  :root[data-theme="dark"] {
    --bg: #08111f; --card: #0f1d35; --text: #e6ecf7; --muted: #9aabc8;
    --border: #1e3256; --accent: #6ea8ff; --accent-2: #a78bfa; --accent-3: #22d3ee; --accent-text: #08111f;
    --accent-soft: #13284a; --tag-bg: #172b4d; --shadow: none;
    --glass: rgba(15,29,53,.72); --blob-opacity: .45;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: var(--accent-text); }

  /* ── Static background glow (plain gradients, no blur filters or animation) ── */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(60vmax circle at 0% 0%, color-mix(in srgb, var(--accent) calc(var(--blob-opacity) * 60%), transparent), transparent 70%),
      radial-gradient(55vmax circle at 100% 10%, color-mix(in srgb, var(--accent-2) calc(var(--blob-opacity) * 50%), transparent), transparent 70%);
  }
  .grain {
    position: absolute; inset: 0; opacity: .05;
    background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
  }

  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 40px; }

  /* ── Hero ── */
  header {
    display: flex; flex-direction: column;
    padding: 64px 0 8px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border); background: var(--glass);
    padding: 6px 12px; border-radius: 999px; margin-bottom: 22px;
  }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  h1 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: clamp(2.6rem, 8vw, 5rem);
    line-height: .95;
    margin: 0 0 22px;
    letter-spacing: -0.04em;
  }
  .grad {
    background: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 30%, var(--accent-3) 55%, var(--accent) 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro { color: var(--muted); max-width: 52ch; margin: 0 0 28px; font-size: clamp(1.05rem, 2vw, 1.2rem); }
  .stats { display: flex; gap: 28px; margin: 0 0 30px; flex-wrap: wrap; }
  .stat b {
    display: block; font-family: "Space Grotesk", Inter, sans-serif; font-size: 2.2rem; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--muted); font-size: .85rem; }

  .jump, .profiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .jump a, .profiles a {
    color: var(--text); text-decoration: none; font-weight: 500; font-size: .92rem;
    border: 1px solid var(--border); background: var(--glass);
    padding: 8px 16px; border-radius: 999px; display: inline-block;
    transition: border-color .2s, color .2s;
  }
  .jump a:hover, .profiles a:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Sections ── */
  .hobby { margin-top: 64px; scroll-margin-top: 24px; }
  .hobby-head { margin-bottom: 26px; }
  .hobby-num {
    font-family: "Space Grotesk", Inter, sans-serif; font-weight: 500; color: var(--accent);
    font-size: .9rem; letter-spacing: .1em; display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .hobby-num::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
  .hobby-head h2 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1; margin: 0 0 12px; letter-spacing: -0.03em;
  }
  .hobby-head p { color: var(--muted); margin: 0 0 16px; max-width: 60ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 18px 50px -20px color-mix(in srgb, var(--accent) 45%, transparent); }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent-2) 30%, transparent), transparent 55%),
      radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--accent-3) 28%, transparent), transparent 55%),
      var(--accent-soft);
    display: grid; place-items: center; font-size: 3.4rem;
  }
  .thumb .emoji { display: inline-block; transition: transform .2s; }
  .card:hover .thumb .emoji { transform: scale(1.12); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .card:hover .thumb img { transform: scale(1.05); }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h3 { font-size: 1.15rem; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .desc { color: var(--muted); margin: 0; font-size: .95rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--tag-bg); color: var(--muted); font-size: .75rem; padding: 2px 9px; border-radius: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .88rem; display: inline-block;
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--text); background: var(--card);
  }
  .links a.primary {
    background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--accent-2)));
    border-color: var(--accent); color: var(--accent-text);
  }
  .links a:hover { filter: brightness(1.08); }
  .links a:not(.primary):hover { border-color: var(--accent); color: var(--accent); }

  footer {
    margin-top: 80px; color: var(--muted); font-size: .85rem;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 22px;
  }
  .top-btn {
    font: inherit; color: var(--text); background: var(--glass); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .top-btn:hover { border-color: var(--accent); color: var(--accent); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 560px) {
    header { padding-top: 40px; }
    .stats { gap: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card, .thumb .emoji, .thumb img { transition: none; }
    .card:hover, .card:hover .thumb .emoji, .card:hover .thumb img { transform: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="grain"></div>
</div>

<main>
  <header>
    <div class="eyebrow"><span class="dot"></span>masterpigg · maker &amp; dev</div>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pill = l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;

function card(p) {
  const thumb = p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.title)} render" loading="lazy">`
    : `<span class="emoji" aria-hidden="true">${p.emoji || "✨"}</span>`;
  const links = (p.links || []).filter(l => l.url).map((l, i) =>
    `<a class="${i === 0 ? "primary" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  return `<article class="card">
    <div class="thumb">${thumb}</div>
    <div class="body">
      <h3>${esc(p.title)}${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}</h3>
      <p class="desc">${esc(p.description)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </div>
  </article>`;
}

const projects = SECTIONS.flatMap(s => s.projects);

document.getElementById("jump").innerHTML = SECTIONS
  .map(s => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join("");

document.getElementById("stats").innerHTML = [
  [projects.length, "projects"],
  [SECTIONS.length, "hobbies"],
  [projects.filter(p => (p.links || []).some(l => l.url)).length, "ready to try"],
].map(([n, label]) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`).join("");

document.getElementById("sections").innerHTML = SECTIONS.map((s, i) => `

    <div class="hobby-head">
      <div class="hobby-num">${String(i + 1).padStart(2, "0")}</div>
      <h2>${esc(s.title)}</h2>
      ${s.intro ? `<p>${esc(s.intro)}</p>` : ""}

  </section>`).join("");

document.getElementById("year").textContent = new Date().getFullYear();

document.getElementById("top").addEventListener("click", () => window.scrollTo({ top: 0 }));

</body>
</html>
